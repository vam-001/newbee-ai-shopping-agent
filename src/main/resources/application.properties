# Load local .env (gitignored) if present; environment variables still take precedence.
spring.config.import=optional:file:.env[.properties]

server.port=28089
spring.thymeleaf.cache=false
spring.datasource.name=newbee-mall-datasource
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:newbee_mall_db}?useUnicode=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&autoReconnect=true&useSSL=false&allowMultiQueries=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.pool-name=hikariCP
spring.datasource.hikari.max-lifetime=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1
# mybatis config
mybatis.mapper-locations=classpath:mapper/*Mapper.xml

# ===== AI shopping agent =====
app.ai.api-key=${AI_API_KEY:not-configured}
app.ai.base-url=${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
app.ai.chat-model=${AI_CHAT_MODEL:qwen-plus}
app.ai.temperature=0.7
app.ai.timeout-seconds=60
app.ai.max-memory-messages=20
app.ai.rag-top-k=5
app.ai.rag-min-score=0.35
app.ai.rate-limit-per-minute=10
app.ai.memory-store=${AI_MEMORY_STORE:redis}
app.ai.memory-ttl-days=7
app.ai.index-batch-size=50
# 公网部署建议设为 true：只允许登录用户使用 AI 导购
app.ai.require-login=${AI_REQUIRE_LOGIN:false}

# ===== Redis (AI chat memory / rate limit) =====
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=3s